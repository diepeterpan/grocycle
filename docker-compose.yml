services:
  grocycle:
    container_name: grocycle
    image: grocycle:latest
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:${GROCYCLE_WEB_PORT:-8080}"
    volumes:
      # Host path to monitor mounted read-only into container
      - "${HOST_MONITOR_PATH:-/}:${CONTAINER_MONITOR_PATH:-/monitored}:ro"
      # Persistent SQLite metrics database volume across container updates
      - "grocycle_data:/var/lib/grocycle"
      # Persistent logs volume
      - "grocycle_logs:/var/log"
    environment:
      - HOST_MONITOR_PATH=${HOST_MONITOR_PATH:-/}
      - CONTAINER_MONITOR_PATH=${CONTAINER_MONITOR_PATH:-/monitored}
      - GROCYCLE_MONITORED_ROOTS=${GROCYCLE_MONITORED_ROOTS:-/monitored}
      - GROCYCLE_SCAN_INTERVAL=${GROCYCLE_SCAN_INTERVAL:-1h}
      - GROCYCLE_EXCLUDED_PREFIXES=${GROCYCLE_EXCLUDED_PREFIXES:-/proc,/sys,/dev,/run,/tmp,/var/tmp}
      - GROCYCLE_THROTTLE_BATCH=${GROCYCLE_THROTTLE_BATCH:-250}
      - GROCYCLE_THROTTLE_SLEEP_MS=${GROCYCLE_THROTTLE_SLEEP_MS:-15}
      - GROCYCLE_DB_PATH=${GROCYCLE_DB_PATH:-/var/lib/grocycle/grocycle.db}
      - GROCYCLE_SOCKET_PATH=${GROCYCLE_SOCKET_PATH:-/run/grocycle/grocycle.sock}
      - GROCYCLE_LOG_FILE=${GROCYCLE_LOG_FILE:-/var/log/grocycle.log}
      - GROCYCLE_WEB_PORT=${GROCYCLE_WEB_PORT:-8080}
      - GROCYCLE_WEB_AUTH=${GROCYCLE_WEB_AUTH:-}
      - GROCYCLE_WEB_MAX_CLIENTS=${GROCYCLE_WEB_MAX_CLIENTS:-5}
    build:
      context: .
      args:
        VERSION: ${GROCYCLE_VERSION:-1.0.0}
      dockerfile_inline: |
        FROM debian:trixie-slim

        ARG VERSION=1.0.0

        # Install runtime dependencies and utilities
        RUN apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libsqlite3-0 \
            tini \
            jq \
            bash \
            procps \
            && rm -rf /var/lib/apt/lists/*

        # Download and install pre-compiled release package
        RUN curl -fsSL -o /tmp/grocycle.deb \
            "https://github.com/diepeterpan/grocycle/releases/download/v$${VERSION}/grocycle_$${VERSION}_amd64.deb" \
            && dpkg -i /tmp/grocycle.deb \
            && rm -f /tmp/grocycle.deb

        # Extract entrypoint.sh directly from GitHub release archive using $$VERSION (no host files required)
        RUN curl -fsSL "https://github.com/diepeterpan/grocycle/archive/refs/tags/v$${VERSION}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=2 --wildcards "*/docker/entrypoint.sh" \
            && mv /usr/local/bin/entrypoint.sh /usr/local/bin/docker-entrypoint.sh \
            && chmod +x /usr/local/bin/docker-entrypoint.sh

        ENTRYPOINT ["/usr/local/bin/docker-entrypoint.sh"]

volumes:
  grocycle_data:
    name: grocycle_data
  grocycle_logs:
    name: grocycle_logs
