name: CI Quality & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libsqlite3-dev \
            sqlite3 \
            clang-tidy \
            clang-format

      - name: Configure CMake & Export Compile Commands
        run: |
          echo "${{ github.run_number }}" > .build_number
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify Code Formatting
        run: |
          cmake --build build --target format
          git diff --exit-code || (echo "Formatting differences found! Please run ./scripts/verify.sh before check-in." && exit 1)

      - name: Compile Grocycle & Tests
        run: |
          cmake --build build -- -j$(nproc)

      - name: Run Test Suite
        run: |
          cd build
          ctest --output-on-failure

      - name: Run Static Analysis (clang-tidy)
        run: |
          cmake --build build --target lint

      - name: Build distribution packages (.deb and .tar.gz)
        run: |
          cmake --build build --target package
          mkdir -p artifacts
          cp build/grocycle_*.deb artifacts/
          cp build/grocycle_*.tar.gz artifacts/

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grocycle-linux-amd64-build-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
