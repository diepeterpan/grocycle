name: Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libsqlite3-dev \
            sqlite3

      - name: Configure CMake
        run: |
          # Seed build number with run number
          echo "${{ github.run_number }}" > .build_number
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROJECT_VERSION=${{ steps.get_version.outputs.VERSION }}

      - name: Compile and Test
        run: |
          cmake --build build -- -j$(nproc)
          cd build && ctest --output-on-failure

      - name: Generate Release Packages
        run: |
          cmake --build build --target package
          mkdir -p release_assets
          cp build/grocycle_*.deb release_assets/
          cp build/grocycle_*.tar.gz release_assets/
          
          # Generate SHA256 checksums
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Grocycle v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.deb
            release_assets/*.tar.gz
            release_assets/SHA256SUMS.txt
